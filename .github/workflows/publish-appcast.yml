name: Publish Sparkle appcast

# Dispatch-only: the github-pages environment allows deployments from the main
# branch, and release events run on the tag ref, which it rejects. The release
# script dispatches this on main after publishing; dispatch it manually to retry.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published stable release containing appcast.xml (for example v1.0.0)'
        required: true
        type: string

# Never deploy from a PR, a development build or an unsigned/fake feed.
permissions:
  contents: read

concurrency:
  group: audionotes-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download published appcast and verify every release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'A stable semantic release tag is required.'; exit 1; }
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(r["isDraft"] or r["isPrerelease"])'
          # A historical dispatch must never roll the stable feed backwards.
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          [[ "$RELEASE_TAG" == "$latest" ]] || { echo 'Only the latest stable release can deploy the stable feed.'; exit 1; }
          mkdir -p site
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir site
          python3 scripts/release/validate_appcast.py site/appcast.xml --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified feed
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: deployed
      - name: Verify public HTTPS feed and real enclosures
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          tar -xf deployed/artifact.tar -C deployed
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          feed="https://${owner,,}.github.io/${repository}/appcast.xml"
          # Pages/CDN may need a short propagation interval. No quarantine bypasses.
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --proto '=https' --tlsv1.2 "$feed" -o public-appcast.xml && cmp -s public-appcast.xml deployed/appcast.xml; then
              python3 scripts/release/validate_appcast.py public-appcast.xml --repository "$GITHUB_REPOSITORY" --compare deployed/appcast.xml
              exit 0
            fi
            sleep 10
          done
          echo 'Public Pages appcast did not match the validated feed.'
          exit 1
