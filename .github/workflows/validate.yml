name: Validate AudioNotes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    # Project format 110 requires Xcode 27; macos-26 defaults to Xcode 26.6.
    # https://github.com/actions/runner-images/issues/14404
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify Xcode and project compatibility
        run: |
          xcodebuild -version
          xcodebuild -version | grep -E '^Xcode 27([.]|$)'
          xcodebuild -list -project AudioNotes.xcodeproj
      - name: Validate release tooling
        run: |
          bash -n scripts/release/release.sh scripts/release/preview.sh
          python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Debug tests
        run: xcodebuild -project AudioNotes.xcodeproj -scheme AudioNotes -configuration Debug -destination 'platform=macOS,arch=arm64' CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test
      - name: Release build
        run: xcodebuild -project AudioNotes.xcodeproj -scheme AudioNotes -configuration Release -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO build
